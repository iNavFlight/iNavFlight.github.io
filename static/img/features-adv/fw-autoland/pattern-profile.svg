<svg width="900" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Altitude profile of the automatic landing: level at approach altitude to the turn point, descent on base leg and final, shallower glide and flare before touchdown">
  <style>
    text{font-family:system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#3a3d2e}
    .mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:12px}
    .small{font-size:11.5px}
    .phase{font-weight:700}
  </style>
  <defs>
    <marker id="tick" markerWidth="10" markerHeight="2" refX="5" refY="1" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,0" stroke="#3a3d2e" stroke-width="1.2"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#dfe3cc"/>
  <rect x="0.5" y="0.5" width="899" height="419" fill="none" stroke="#c9ccb8" stroke-width="1"/>

  <!-- ground -->
  <rect x="40" y="301" width="820" height="90" fill="#d3d7bf"/>
  <line x1="40" y1="300" x2="860" y2="300" stroke="#6f5546" stroke-width="2.5"/>
  <text x="48" y="318" fill="#6f5546" class="small">ground = landing altitude</text>
  <circle cx="560" cy="300" r="5.5" fill="#3a3d2e"/>
  <text x="500" y="340" font-weight="700">landing site</text>

  <!-- reference lines -->
  <line x1="40" y1="80" x2="560" y2="80" stroke="#9a9e8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="40" y1="153" x2="560" y2="153" stroke="#9a9e8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- downwind and base leg -->
  <line x1="60" y1="80" x2="240" y2="80" stroke="#7b7e6c" stroke-width="4" stroke-linecap="round"/>
  <text x="100" y="66" fill="#7b7e6c" class="phase">Downwind</text>
  <circle cx="240" cy="80" r="5.5" fill="#d07a1f"/>
  <text x="222" y="62" class="small">turn point</text>
  <line x1="240" y1="80" x2="380" y2="153" stroke="#d07a1f" stroke-width="4" stroke-linecap="round"/>
  <text x="270" y="106" fill="#d07a1f" class="phase">Base leg</text>
  <circle cx="380" cy="153" r="5.5" fill="#6a3d9a"/>
  <text x="372" y="176" class="small" text-anchor="end">final approach point</text>

  <!-- final: steep, aimed at the land point below ground -->
  <line x1="380" y1="153" x2="511" y2="260" stroke="#6a3d9a" stroke-width="4" stroke-linecap="round"/>
  <line x1="511" y1="260" x2="620" y2="349" stroke="#6a3d9a" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="450" y="146" fill="#6a3d9a" class="phase">Final approach</text>
  <text x="450" y="162" fill="#6a3d9a" class="small">throttle reduced by the pitch-to-throttle modifier</text>
  <text x="630" y="346" class="small" fill="#6a3d9a">the final aims at the land point,</text>
  <text x="630" y="362" class="small" fill="#6a3d9a">⅔ approach altitude below ground</text>

  <!-- glide and flare: progressively shallower -->
  <line x1="511" y1="260" x2="560" y2="282" stroke="#2e6fb0" stroke-width="4" stroke-linecap="round"/>
  <line x1="560" y1="282" x2="632" y2="300" stroke="#1f4d7d" stroke-width="4" stroke-linecap="round"/>
  <line x1="536" y1="269" x2="600" y2="224" stroke="#2e6fb0" stroke-width="1"/>
  <text x="604" y="212" fill="#2e6fb0" class="phase">Glide</text>
  <text x="604" y="226" fill="#2e6fb0" class="small">motor off, glide pitch held</text>
  <line x1="598" y1="291" x2="672" y2="262" stroke="#1f4d7d" stroke-width="1"/>
  <text x="676" y="252" fill="#1f4d7d" class="phase">Flare</text>
  <text x="676" y="266" fill="#1f4d7d" class="small">rangefinder only, flare pitch held</text>

  <!-- altitude dimensions -->
  <line x1="48" y1="80" x2="48" y2="300" stroke="#3a3d2e" stroke-width="1" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <text x="56" y="190" class="mono">approach altitude</text>
  <line x1="372" y1="160" x2="372" y2="300" stroke="#3a3d2e" stroke-width="1" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <text x="364" y="240" class="mono" text-anchor="end">⅔ approach altitude</text>

  <!-- horizontal dimension -->
  <line x1="380" y1="380" x2="560" y2="380" stroke="#3a3d2e" stroke-width="1"/>
  <line x1="380" y1="375" x2="380" y2="385" stroke="#3a3d2e" stroke-width="1"/>
  <line x1="560" y1="375" x2="560" y2="385" stroke="#3a3d2e" stroke-width="1"/>
  <text x="420" y="398" class="mono">approach length</text>

  <text x="700" y="410" class="small" fill="#7b7e6c">altitudes not to scale</text>
</svg>
