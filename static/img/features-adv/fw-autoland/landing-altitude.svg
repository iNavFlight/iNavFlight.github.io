<svg width="900" height="470" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="Landing altitude and glide altitude together set where the glide begins above the real ground and therefore where the plane touches down">
  <style>
    text{font-family:system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#3a3d2e}
    .mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:12px}
    .small{font-size:11.5px}
  </style>
  <defs>
    <marker id="a-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#2e6fb0"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#dfe3cc"/>
  <rect x="0.5" y="0.5" width="899" height="469" fill="none" stroke="#c9ccb8" stroke-width="1"/>
  <text x="20" y="30" font-weight="700">The glide begins when the plane is <tspan class="mono">landing altitude + glide altitude</tspan> above the real ground.</text>
  <text x="20" y="50" class="small">From there the motor is off and the plane sinks much more slowly than on the final, so this point decides where it touches down.</text>
  <text x="20" y="66" class="small"><tspan fill="#6a3d9a" font-weight="700">purple</tspan> final approach, aimed at the landing altitude over the site · <tspan fill="#d07a1f" font-weight="700">orange</tspan> glide altitude, measured from the landing altitude · <tspan fill="#2e6fb0" font-weight="700">blue</tspan> glide</text>
  <!-- panel Landing altitude = ground -->
  <rect x="20" y="90" width="280" height="360" rx="6" fill="#e6e9d6" stroke="#c9ccb8"/>
  <text x="32" y="112" font-weight="700">Landing altitude = ground</text>
  <rect x="21" y="341" width="278" height="108" fill="#d3d7bf"/>
  <line x1="21" y1="340" x2="299" y2="340" stroke="#6f5546" stroke-width="2.5"/>
  <text x="30" y="356" fill="#6f5546" class="small">real ground</text>
  <circle cx="220" cy="340" r="5" fill="#3a3d2e"/>
  <text x="220" y="372" class="small" text-anchor="middle" font-weight="700">site</text>
  <line x1="40" y1="150" x2="192" y2="310" stroke="#6a3d9a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="192" y1="310" x2="220" y2="340" stroke="#6a3d9a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="192" y1="340" x2="192" y2="310" stroke="#d07a1f" stroke-width="3"/>
  <text x="184" y="329" class="small" fill="#d07a1f" text-anchor="end">glide altitude</text>
  <circle cx="192" cy="310" r="4.5" fill="#2e6fb0"/>
  <line x1="192" y1="310" x2="277" y2="340" stroke="#2e6fb0" stroke-width="3.5" stroke-linecap="round"/>
  <text x="288" y="392" class="small" fill="#2e6fb0" text-anchor="end">touchdown a little beyond the site</text>
  <line x1="277" y1="344" x2="277" y2="378" stroke="#2e6fb0" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- panel Landing altitude above the ground -->
  <rect x="310" y="90" width="280" height="360" rx="6" fill="#e6e9d6" stroke="#c9ccb8"/>
  <text x="322" y="112" font-weight="700">Landing altitude above the ground</text>
  <rect x="311" y="341" width="278" height="108" fill="#d3d7bf"/>
  <line x1="311" y1="340" x2="589" y2="340" stroke="#6f5546" stroke-width="2.5"/>
  <circle cx="510" cy="340" r="5" fill="#3a3d2e"/>
  <text x="510" y="372" class="small" text-anchor="middle" font-weight="700">site</text>
  <line x1="350" y1="300" x2="580" y2="300" stroke="#6a3d9a" stroke-width="1" stroke-dasharray="2 4"/>
  <circle cx="510" cy="300" r="3.5" fill="#6a3d9a"/>
  <text x="354" y="316" class="small" fill="#6a3d9a">landing altitude</text>
  <line x1="330" y1="150" x2="474" y2="270" stroke="#6a3d9a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="474" y1="270" x2="510" y2="300" stroke="#6a3d9a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="474" y1="300" x2="474" y2="270" stroke="#d07a1f" stroke-width="3"/>
  <text x="466" y="289" class="small" fill="#d07a1f" text-anchor="end">glide altitude</text>
  <circle cx="474" cy="270" r="4.5" fill="#2e6fb0"/>
  <line x1="474" y1="270" x2="576" y2="306" stroke="#2e6fb0" stroke-width="3.5" stroke-linecap="round" marker-end="url(#a-blue)"/>
  <text x="578" y="392" class="small" fill="#2e6fb0" text-anchor="end">floats far beyond →</text>
  <!-- panel Landing altitude below the ground, -->
  <rect x="600" y="90" width="280" height="360" rx="6" fill="#e6e9d6" stroke="#c9ccb8"/>
  <text x="612" y="112" font-weight="700">Landing altitude below the ground,</text>
  <text x="612" y="128" font-weight="700">glide altitude enlarged</text>
  <rect x="601" y="341" width="278" height="108" fill="#d3d7bf"/>
  <line x1="601" y1="340" x2="879" y2="340" stroke="#6f5546" stroke-width="2.5"/>
  <circle cx="800" cy="340" r="5" fill="#3a3d2e"/>
  <text x="800" y="372" class="small" text-anchor="middle" font-weight="700">site</text>
  <line x1="640" y1="410" x2="870" y2="410" stroke="#6a3d9a" stroke-width="1" stroke-dasharray="2 4"/>
  <circle cx="800" cy="410" r="3.5" fill="#6a3d9a"/>
  <text x="868" y="424" class="small" fill="#6a3d9a" text-anchor="end">landing altitude</text>
  <line x1="620" y1="150" x2="731" y2="310" stroke="#6a3d9a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="731" y1="310" x2="800" y2="410" stroke="#6a3d9a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="731" y1="410" x2="731" y2="310" stroke="#d07a1f" stroke-width="3"/>
  <text x="723" y="364" class="small" fill="#d07a1f" text-anchor="end">glide altitude</text>
  <circle cx="731" cy="310" r="4.5" fill="#2e6fb0"/>
  <line x1="731" y1="310" x2="816" y2="340" stroke="#2e6fb0" stroke-width="3.5" stroke-linecap="round"/>
  <text x="816" y="392" class="small" fill="#2e6fb0" text-anchor="middle">touchdown at the site</text>
  <line x1="816" y1="344" x2="816" y2="378" stroke="#2e6fb0" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="880" y="462" class="small" fill="#7b7e6c" text-anchor="end">not to scale</text>
</svg>
