<svg width="900" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="How the landing direction is chosen from the configured headings and the measured wind">
  <style>
    text{font-family:system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#3a3d2e}
    .mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:12px}
    .small{font-size:11.5px}
  </style>
  <defs>
    <marker id="a-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#3d7a4a"/></marker>
    <marker id="a-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#2e6fb0"/></marker>
    <marker id="a-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#c23c2f"/></marker>
    <marker id="a-wind" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#8a8f7a"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="360" fill="#dfe3cc"/>
  <rect x="0.5" y="0.5" width="899" height="359" fill="none" stroke="#c9ccb8" stroke-width="1"/>

  <!-- site with two runways -->
  <rect x="180" y="183" width="220" height="14" fill="#cbd0b6" stroke="#b5b99f"/>
  <g transform="rotate(-70 290 190)"><rect x="180" y="183" width="220" height="14" fill="#cbd0b6" stroke="#b5b99f"/></g>
  <circle cx="290" cy="190" r="5.5" fill="#3a3d2e"/>
  <!-- headwind sector: ±90° around the wind-from direction 060 -->
  <path d="M290,190 L290,80 A110,110 0 0 1 400,190 A110,110 0 0 1 329,293 Z" fill="#3d7a4a" fill-opacity="0.08" stroke="none"/>
  <path d="M290,80 A110,110 0 0 1 400,190" fill="none" stroke="#3d7a4a" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M400,190 A110,110 0 0 1 329,293" fill="none" stroke="#3d7a4a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- candidate directions: the arrow shows the direction of flight on final -->
  <line x1="290" y1="190" x2="378" y2="190" stroke="#3d7a4a" stroke-width="4.5" marker-end="url(#a-green)"/>
  <text x="392" y="195" fill="#3d7a4a" font-weight="700">090</text>
  <line x1="290" y1="190" x2="320" y2="107" stroke="#2e6fb0" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <text x="318" y="100" fill="#2e6fb0" font-weight="700">020</text>
  <line x1="290" y1="190" x2="202" y2="190" stroke="#c23c2f" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#a-red)"/>
  <text x="166" y="195" fill="#c23c2f" font-weight="700">270</text>
  <line x1="290" y1="190" x2="260" y2="273" stroke="#c23c2f" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#a-red)"/>
  <text x="236" y="292" fill="#c23c2f" font-weight="700">200</text>

  <!-- wind -->
  <line x1="470" y1="86" x2="392" y2="131" stroke="#8a8f7a" stroke-width="5" marker-end="url(#a-wind)"/>
  <text x="478" y="80" fill="#7b7e6c" font-weight="700">wind from 060°</text>
  <text x="130" y="338" fill="#3d7a4a" class="small">shaded: headwind sector, wind from within 90° of the nose</text>

  <!-- explanation -->
  <text x="530" y="140" font-weight="700">Configured for this site</text>
  <text x="530" y="160" class="mono">heading 1 = 90   → 090 or 270</text>
  <text x="530" y="178" class="mono">heading 2 = 20   → 020 or 200</text>
  <text x="530" y="212" font-weight="700">Result</text>
  <text x="530" y="232"><tspan fill="#3d7a4a" font-weight="700">090</tspan>  headwind, 30° off the wind — chosen</text>
  <text x="530" y="250"><tspan fill="#2e6fb0" font-weight="700">020</tspan>  headwind too, but 40° off — loses</text>
  <text x="530" y="268"><tspan fill="#c23c2f" font-weight="700">270, 200</tspan>  tailwind — never used</text>
  <text x="530" y="300" class="small">A negative heading, e.g. -90, offers 090 only:</text>
  <text x="530" y="316" class="small">270 is then not tried even when the wind favours it.</text>
</svg>
