<svg width="900" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Top view of the automatic landing pattern: loiter at the site, downwind to the turn point, base leg, final approach through the site towards the land point">
  <style>
    text{font-family:system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#3a3d2e}
    .mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:12px}
    .small{font-size:11.5px}
    .phase{font-weight:700}
  </style>
  <defs>
    <marker id="arrow-grey" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#7b7e6c"/></marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#6a3d9a"/></marker>
    <marker id="arrow-wind" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#8a8f7a"/></marker>
    <marker id="tick" markerWidth="2" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,10" stroke="#3a3d2e" stroke-width="1.2"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#dfe3cc"/>
  <rect x="0.5" y="0.5" width="899" height="519" fill="none" stroke="#c9ccb8" stroke-width="1"/>

  <!-- wind from 060, blowing toward 240 -->
  <line x1="852" y1="62" x2="778" y2="105" stroke="#8a8f7a" stroke-width="4" marker-end="url(#arrow-wind)"/>
  <text x="770" y="52" fill="#7b7e6c" font-weight="700">wind from 060°</text>

  <!-- strip and landing site -->
  <rect x="480" y="323" width="200" height="14" fill="#cbd0b6" stroke="#b5b99f" stroke-width="1"/>
  <circle cx="580" cy="330" r="5.5" fill="#3a3d2e"/>
  <text x="538" y="406" font-weight="700">landing site</text>

  <!-- loiter circle at the site -->
  <circle cx="580" cy="330" r="56" fill="none" stroke="#2e6fb0" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="470" y="430" fill="#2e6fb0">loiter over the site at approach altitude for at least 30 s:</text>
  <text x="470" y="446" fill="#2e6fb0">the wind is measured and the direction chosen</text>

  <!-- downwind: leaves the circle toward the turn point -->
  <path d="M604,280 C632,160 500,108 320,108" fill="none" stroke="#7b7e6c" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrow-grey)"/>
  <text x="556" y="168" fill="#7b7e6c" class="phase">Downwind</text>
  <text x="556" y="184" fill="#7b7e6c" class="small">straight from the circle to the turn point</text>

  <!-- turn point -->
  <circle cx="310" cy="106" r="5.5" fill="#d07a1f"/>
  <text x="262" y="84" font-weight="700">turn point <tspan font-weight="400" class="small">· approach altitude</tspan></text>

  <!-- base leg with FLY_BY corner onto final -->
  <path d="M310,112 L310,278 A52,52 0 0 0 362,330" fill="none" stroke="#d07a1f" stroke-width="4" stroke-linecap="round"/>
  <text x="326" y="200" fill="#d07a1f" class="phase">Base leg</text>
  <text x="326" y="216" fill="#d07a1f" class="small">descends to ⅔ approach altitude,</text>
  <text x="326" y="232" fill="#d07a1f" class="small">coordinated turn onto final</text>

  <!-- final approach point -->
  <circle cx="310" cy="330" r="5.5" fill="#6a3d9a"/>
  <text x="40" y="368" font-weight="700">final approach point</text>
  <text x="40" y="384" class="small">⅔ approach altitude, one approach length before the site</text>

  <!-- final approach through the site to the land point -->
  <line x1="362" y1="330" x2="575" y2="330" stroke="#6a3d9a" stroke-width="4" stroke-linecap="round"/>
  <text x="376" y="318" fill="#6a3d9a" class="phase">Final approach</text>
  <text x="376" y="352" fill="#2e6fb0" class="small">glide → flare → touchdown</text>
  <line x1="586" y1="330" x2="846" y2="330" stroke="#6a3d9a" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/>
  <circle cx="850" cy="330" r="5.5" fill="none" stroke="#6a3d9a" stroke-width="2"/>
  <text x="652" y="258" font-weight="700">land point</text>
  <text x="652" y="274" class="small">navigation target of the final approach,</text>
  <text x="652" y="290" class="small">⅔ approach altitude below ground,</text>
  <text x="652" y="306" class="small">never reached</text>

  <!-- dimensions -->
  <line x1="310" y1="472" x2="580" y2="472" stroke="#3a3d2e" stroke-width="1" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <text x="388" y="490" class="mono">approach length</text>
  <line x1="580" y1="472" x2="850" y2="472" stroke="#3a3d2e" stroke-width="1" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <text x="658" y="490" class="mono">approach length</text>
  <line x1="250" y1="106" x2="250" y2="330" stroke="#3a3d2e" stroke-width="1" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <text x="242" y="212" class="mono" text-anchor="end">max(4 × loiter radius,</text>
  <text x="242" y="228" class="mono" text-anchor="end">½ approach length)</text>
</svg>
